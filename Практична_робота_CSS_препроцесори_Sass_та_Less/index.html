<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товарів Tech Store</title>
  <link rel="stylesheet" href="style-scss.css">
  <!-- Для перевірки Less заміни style-scss.css на style-less.css. -->
</head>
<body>

  <header>
    <h1>Tech Store</h1>
    <p>Техніка для навчання та відпочинку</p>
  </header>

  <main>
    <h2>Каталог товарів</h2>

    <div class="products">
      <article class="product">
        <h3>Ноутбук</h3>
        <p>Зручний ноутбук для навчання та роботи.</p>
        <p class="price">25 000 грн</p>
        <button class="buy-button" type="button">Купити</button>
      </article>

      <article class="product">
        <h3>Смартфон</h3>
        <p>Смартфон із великим екраном та якісною камерою.</p>
        <p class="price">15 000 грн</p>
        <button class="buy-button" type="button">Купити</button>
      </article>

      <article class="product">
        <h3>Навушники</h3>
        <p>Бездротові навушники для музики та дзвінків.</p>
        <p class="price">3 500 грн</p>
        <button class="buy-button" type="button">Купити</button>
      </article>
    </div>
  </main>

</body>
</html>
