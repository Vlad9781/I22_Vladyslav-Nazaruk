<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картка товару</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Tech Store</h1>
    <p>Техніка для навчання та роботи</p>
  </header>

  <main>
    <div class="product-container">

      <article class="product">
        <span class="sale">Акція</span>

        <img src="banner.jpg" alt="Ноутбук">

        <h2>Ноутбук</h2>

        <p>
          Зручний ноутбук для навчання,
          роботи та перегляду фільмів.
        </p>

        <p class="price">25 000 грн</p>

        <button class="buy-button" type="button">
          Купити
        </button>
      </article>

    </div>
  </main>

</body>
</html>
